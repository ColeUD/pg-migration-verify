version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine dev-tool bumps instead of one per package. Runtime dependencies stay
      # ungrouped: they are pinned and shipped in npm-shrinkwrap.json, so each bump gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must describe the oldest supported Node (engines: >=22), or code could use APIs it lacks.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports only TypeScript < 6.1; move both together by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
