version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine dev-tool bumps instead of one per package. Runtime dependencies stay
      # ungrouped: they are pinned and shipped in npm-shrinkwrap.json, so each bump gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
