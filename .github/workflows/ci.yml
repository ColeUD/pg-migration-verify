name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every supported major of engines.node (>=22), up to 26, the current LTS.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      # The compiled bin over real stdio, as an MCP client starts it (no database configured).
      - run: npm run test:smoke
      # What would be published: dist/*.js and npm-shrinkwrap.json, no sources, maps or tests.
      - run: npm run test:pack

  integration:
    name: integration (postgres ${{ matrix.postgres }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The major versions Supabase runs.
        postgres: [15, 17]
        node: [24]
        # The driver and the live catalog queries on the newest LTS too, without doubling the matrix.
        include:
          - postgres: 17
            node: 26
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Synthetic CI-only credentials for the throwaway service container. With this set, the
      # integration global setup uses the service and never starts embedded-postgres.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Pinned so a Claude Code release cannot change the rules under an unchanged plugin.
      # Validation is offline and needs no login.
      - run: npx -y @anthropic-ai/claude-code@2.1.316 plugin validate . --strict
